spring.application.name=ms-tickets
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
efs.path=${EFS_PATH:/app/efs}
tickets.bucket=${TICKETS_BUCKET:}
aws.region=${AWS_REGION:us-east-1}
reservas.url=${RESERVAS_URL:http://ms-reservas:8080}
tickets.retention-hours=24
tickets.cleanup-delay-ms=3600000
